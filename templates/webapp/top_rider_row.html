<li class="top-rider-row">
  <span class="rider-rank" aria-label="Rank {{ rank }}">{{ rank }}</span>
  <span class="rider-avatar rider-avatar-{{ rank }}" aria-hidden="true">{{ initials }}</span>
  <div class="rider-summary"><strong>{{ name }}</strong><small>{{ trips }} trips this month</small></div>
  <span class="rider-rating" aria-label="Rated {{ rating }} out of 5"><span aria-hidden="true">★</span> {{ rating }}</span>
</li>
